name: Phase B inventory read branch update

on:
  push:
    branches:
      - feat/ebay-seller-operation-boundaries
    paths:
      - .github/workflows/phase-b-inventory-read.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ebay-seller-operation-boundaries
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Apply deterministic inventory_read implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core = r'''/**
           * Pure core for the admin-only eBay `inventory_read` operation.
           *
           * The Edge handler owns authentication, token resolution, and provider I/O.
           * This module only validates bounded input and copies a strict allowlist from
           * eBay inventory-item and offer responses. Unknown fields are never returned.
           */

          export interface InventoryReadInput {
            accountId: string;
            limit: number;
            offset: number;
          }

          export type InventoryReadInputResult =
            | { ok: true; input: InventoryReadInput }
            | { ok: false; errorCode: string; message: string };

          export const DEFAULT_INVENTORY_READ_LIMIT = 25;
          export const MAX_INVENTORY_READ_LIMIT = 25;
          export const MAX_INVENTORY_READ_OFFSET = 100_000;
          export const MAX_OFFERS_PER_SKU = 25;

          const MAX_ACCOUNT_ID_LENGTH = 64;
          const MAX_SKU_LENGTH = 128;

          function trimmedString(value: unknown, maxLength: number): string | null {
            if (typeof value !== "string") return null;
            const normalized = value.trim();
            return normalized.length > 0 && normalized.length <= maxLength ? normalized : null;
          }

          function boundedInteger(
            value: unknown,
            fallback: number,
            minimum: number,
            maximum: number,
          ): number | null {
            if (value === undefined || value === null) return fallback;
            if (typeof value !== "number" || !Number.isSafeInteger(value)) return null;
            return value >= minimum && value <= maximum ? value : null;
          }

          export function parseInventoryReadInput(
            body: Record<string, unknown>,
          ): InventoryReadInputResult {
            const accountId = trimmedString(body.account_id, MAX_ACCOUNT_ID_LENGTH);
            if (!accountId) {
              return {
                ok: false,
                errorCode: "MISSING_ACCOUNT",
                message: "account_id is required.",
              };
            }

            const limit = boundedInteger(
              body.limit,
              DEFAULT_INVENTORY_READ_LIMIT,
              1,
              MAX_INVENTORY_READ_LIMIT,
            );
            if (limit === null) {
              return {
                ok: false,
                errorCode: "INVALID_LIMIT",
                message: `limit must be an integer from 1 to ${MAX_INVENTORY_READ_LIMIT}.`,
              };
            }

            const offset = boundedInteger(body.offset, 0, 0, MAX_INVENTORY_READ_OFFSET);
            if (offset === null) {
              return {
                ok: false,
                errorCode: "INVALID_OFFSET",
                message: `offset must be an integer from 0 to ${MAX_INVENTORY_READ_OFFSET}.`,
              };
            }

            return { ok: true, input: { accountId, limit, offset } };
          }

          function asRecord(value: unknown): Record<string, unknown> | null {
            return value !== null && typeof value === "object" && !Array.isArray(value)
              ? (value as Record<string, unknown>)
              : null;
          }

          function scalarString(value: unknown, maxLength: number): string | null {
            if (typeof value === "number" && Number.isFinite(value)) {
              return trimmedString(String(value), maxLength);
            }
            return trimmedString(value, maxLength);
          }

          function nonNegativeInteger(value: unknown): number | null {
            if (typeof value === "number" && Number.isSafeInteger(value) && value >= 0) {
              return value;
            }
            if (typeof value === "string" && /^\d+$/.test(value.trim())) {
              const parsed = Number(value);
              return Number.isSafeInteger(parsed) ? parsed : null;
            }
            return null;
          }

          export interface SanitizedInventoryOffer {
            offerId: string | null;
            status: string | null;
            marketplaceId: string | null;
            format: string | null;
            price: {
              value: string | null;
              currency: string | null;
            };
            listingId: string | null;
          }

          export interface SanitizedInventoryItem {
            sku: string;
            title: string | null;
            condition: string | null;
            qty: number | null;
            offers: SanitizedInventoryOffer[];
          }

          export interface SanitizedInventoryRead {
            items: SanitizedInventoryItem[];
            pagination: {
              limit: number;
              offset: number;
              total: number | null;
              size: number;
            };
          }

          function sanitizeOffers(raw: unknown): SanitizedInventoryOffer[] {
            const root = asRecord(raw);
            const providerOffers = root && Array.isArray(root.offers) ? root.offers : [];
            const offers: SanitizedInventoryOffer[] = [];

            for (const entry of providerOffers.slice(0, MAX_OFFERS_PER_SKU)) {
              const offer = asRecord(entry);
              if (!offer) continue;
              const pricingSummary = asRecord(offer.pricingSummary);
              const price = asRecord(pricingSummary?.price);
              const listing = asRecord(offer.listing);

              offers.push({
                offerId: trimmedString(offer.offerId, 128),
                status: trimmedString(offer.status, 64),
                marketplaceId: trimmedString(offer.marketplaceId, 32),
                format: trimmedString(offer.format, 64),
                price: {
                  value: scalarString(price?.value, 32),
                  currency: trimmedString(price?.currency, 8),
                },
                listingId: trimmedString(listing?.listingId, 128),
              });
            }

            return offers;
          }

          export function sanitizeInventoryRead(
            rawInventory: unknown,
            offersBySku: Record<string, unknown>,
            input: Pick<InventoryReadInput, "limit" | "offset">,
          ): SanitizedInventoryRead {
            const root = asRecord(rawInventory);
            const providerItems = root && Array.isArray(root.inventoryItems) ? root.inventoryItems : [];
            const items: SanitizedInventoryItem[] = [];

            for (const entry of providerItems.slice(0, input.limit)) {
              const item = asRecord(entry);
              if (!item) continue;
              const sku = trimmedString(item.sku, MAX_SKU_LENGTH);
              if (!sku) continue;

              const product = asRecord(item.product);
              const availability = asRecord(item.availability);
              const shipToLocation = asRecord(availability?.shipToLocationAvailability);

              items.push({
                sku,
                title: trimmedString(product?.title, 500),
                condition: trimmedString(item.condition, 128),
                qty: nonNegativeInteger(shipToLocation?.quantity),
                offers: sanitizeOffers(offersBySku[sku]),
              });
            }

            return {
              items,
              pagination: {
                limit: input.limit,
                offset: input.offset,
                total: nonNegativeInteger(root?.total),
                size: items.length,
              },
            };
          }
          '''.replace("          ", "")

          tests = r'''import { describe, expect, it } from "vitest";
          import {
            DEFAULT_INVENTORY_READ_LIMIT,
            MAX_INVENTORY_READ_LIMIT,
            MAX_OFFERS_PER_SKU,
            parseInventoryReadInput,
            sanitizeInventoryRead,
          } from "../../../supabase/functions/_shared/ebay-inventory-read-core";

          describe("parseInventoryReadInput", () => {
            it("requires a bounded account_id", () => {
              expect(parseInventoryReadInput({})).toMatchObject({
                ok: false,
                errorCode: "MISSING_ACCOUNT",
              });
              expect(parseInventoryReadInput({ account_id: "x".repeat(65) })).toMatchObject({
                ok: false,
                errorCode: "MISSING_ACCOUNT",
              });
            });

            it("trims account_id and defaults pagination", () => {
              expect(parseInventoryReadInput({ account_id: " account-1 " })).toEqual({
                ok: true,
                input: {
                  accountId: "account-1",
                  limit: DEFAULT_INVENTORY_READ_LIMIT,
                  offset: 0,
                },
              });
            });

            it("accepts bounded integer pagination", () => {
              expect(
                parseInventoryReadInput({
                  account_id: "account-1",
                  limit: MAX_INVENTORY_READ_LIMIT,
                  offset: 250,
                }),
              ).toEqual({
                ok: true,
                input: {
                  accountId: "account-1",
                  limit: MAX_INVENTORY_READ_LIMIT,
                  offset: 250,
                },
              });
            });

            it("rejects invalid limit values", () => {
              for (const limit of [0, MAX_INVENTORY_READ_LIMIT + 1, 1.5, "10"]) {
                expect(parseInventoryReadInput({ account_id: "A", limit })).toMatchObject({
                  ok: false,
                  errorCode: "INVALID_LIMIT",
                });
              }
            });

            it("rejects invalid offset values", () => {
              for (const offset of [-1, 1.5, "0", 100_001]) {
                expect(parseInventoryReadInput({ account_id: "A", offset })).toMatchObject({
                  ok: false,
                  errorCode: "INVALID_OFFSET",
                });
              }
            });
          });

          describe("sanitizeInventoryRead", () => {
            it("allowlists inventory and offer fields", () => {
              const result = sanitizeInventoryRead(
                {
                  total: 1,
                  inventoryItems: [
                    {
                      sku: "SKU-1",
                      condition: "NEW",
                      product: { title: "Charizard", subtitle: "ignored" },
                      availability: {
                        shipToLocationAvailability: { quantity: 3, allocationByFormat: "ignored" },
                      },
                      refresh_token: "never-copy",
                    },
                  ],
                },
                {
                  "SKU-1": {
                    offers: [
                      {
                        offerId: "offer-1",
                        status: "PUBLISHED",
                        marketplaceId: "EBAY_US",
                        format: "FIXED_PRICE",
                        pricingSummary: { price: { value: "12.50", currency: "USD", secret: "x" } },
                        listing: { listingId: "listing-1", listingUri: "ignored" },
                        access_token: "never-copy",
                      },
                    ],
                  },
                },
                { limit: 25, offset: 0 },
              );

              expect(result).toEqual({
                items: [
                  {
                    sku: "SKU-1",
                    title: "Charizard",
                    condition: "NEW",
                    qty: 3,
                    offers: [
                      {
                        offerId: "offer-1",
                        status: "PUBLISHED",
                        marketplaceId: "EBAY_US",
                        format: "FIXED_PRICE",
                        price: { value: "12.50", currency: "USD" },
                        listingId: "listing-1",
                      },
                    ],
                  },
                ],
                pagination: { limit: 25, offset: 0, total: 1, size: 1 },
              });
            });

            it("drops unknown and secret-shaped provider fields", () => {
              const result = sanitizeInventoryRead(
                {
                  inventoryItems: [
                    {
                      sku: "SKU-1",
                      product: { title: "Card" },
                      availability: { shipToLocationAvailability: { quantity: "2" } },
                      encrypted_credential: "ciphertext-never-copy",
                    },
                  ],
                },
                {
                  "SKU-1": {
                    offers: [
                      {
                        offerId: "offer-1",
                        token: "provider-token-never-copy",
                        pricingSummary: { price: { value: 9.99, currency: "USD" } },
                      },
                    ],
                  },
                },
                { limit: 1, offset: 0 },
              );
              const serialized = JSON.stringify(result);
              expect(serialized).not.toContain("encrypted_credential");
              expect(serialized).not.toContain("ciphertext-never-copy");
              expect(serialized).not.toContain("provider-token-never-copy");
              expect(result.items[0].qty).toBe(2);
              expect(result.items[0].offers[0].price.value).toBe("9.99");
            });

            it("fails safe on malformed provider input", () => {
              expect(sanitizeInventoryRead(null, {}, { limit: 5, offset: 10 })).toEqual({
                items: [],
                pagination: { limit: 5, offset: 10, total: null, size: 0 },
              });
              expect(
                sanitizeInventoryRead(
                  { total: "nope", inventoryItems: [null, 7, { sku: "" }] },
                  {},
                  { limit: 5, offset: 10 },
                ),
              ).toEqual({
                items: [],
                pagination: { limit: 5, offset: 10, total: null, size: 0 },
              });
            });

            it("caps items and offers at the validated bounds", () => {
              const inventoryItems = Array.from(
                { length: MAX_INVENTORY_READ_LIMIT + 2 },
                (_, index) => ({ sku: `SKU-${index}` }),
              );
              const offers = Array.from({ length: MAX_OFFERS_PER_SKU + 2 }, (_, index) => ({
                offerId: `offer-${index}`,
              }));
              const result = sanitizeInventoryRead(
                { inventoryItems },
                { "SKU-0": { offers } },
                { limit: MAX_INVENTORY_READ_LIMIT, offset: 0 },
              );
              expect(result.items).toHaveLength(MAX_INVENTORY_READ_LIMIT);
              expect(result.items[0].offers).toHaveLength(MAX_OFFERS_PER_SKU);
            });
          });
          '''.replace("          ", "")

          shim = '''import { handleEbay } from "../_shared/ebay.ts";

          Deno.serve((req) => handleEbay(req, "inventory_read"));
          '''.replace("          ", "")

          Path("supabase/functions/_shared/ebay-inventory-read-core.ts").write_text(core)
          Path("src/test/ebay/inventory-read-core.test.ts").write_text(tests)
          Path("supabase/functions/ebay-inventory-read").mkdir(parents=True, exist_ok=True)
          Path("supabase/functions/ebay-inventory-read/index.ts").write_text(shim)

          ebay_path = Path("supabase/functions/_shared/ebay.ts")
          ebay = ebay_path.read_text()
          import_marker = 'import { parseListingFeesInput, sanitizeListingFees } from "./ebay-listing-fees-core.ts";'
          inventory_import = 'import { parseInventoryReadInput, sanitizeInventoryRead } from "./ebay-inventory-read-core.ts";'
          assert ebay.count(import_marker) == 1
          assert inventory_import not in ebay
          ebay = ebay.replace(import_marker, import_marker + "\n" + inventory_import, 1)

          union_marker = '  | "listing_fees";'
          assert ebay.count(union_marker) == 1
          ebay = ebay.replace(union_marker, '  | "listing_fees" | "inventory_read";', 1)

          listing_marker = '  if (operation === "listing_fees") {'
          assert ebay.count(listing_marker) == 1
          inventory_branch = r'''  if (operation === "inventory_read") {
            // Read-only seller inventory discovery. The request is bounded to at
            // most 25 SKUs so the offers-by-SKU fan-out cannot grow without limit.
            // No marketplace mutation flag applies and no provider body is returned.
            const parsed = parseInventoryReadInput(body);
            if (!parsed.ok) {
              return reply(
                { status: "error", error_code: parsed.errorCode, message: parsed.message },
                400,
              );
            }

            const admin = makeAdmin();
            const startedAt = Date.now();
            let accessToken: string;
            try {
              accessToken = await userAccessToken(admin, parsed.input.accountId);
            } catch {
              const recorded = await recordApiRun(
                admin,
                parsed.input.accountId,
                "inventory_read",
                "error",
                Date.now() - startedAt,
                "reauthorization_required",
              );
              if (!recorded) {
                return reply({ status: "error", error_code: "api_run_persist_failed" }, 500);
              }
              return unavailable(operation, "Connected eBay account");
            }

            try {
              const query = new URLSearchParams({
                limit: String(parsed.input.limit),
                offset: String(parsed.input.offset),
              });
              const inventory = await ebayFetch(
                `/sell/inventory/v1/inventory_item?${query.toString()}`,
                accessToken,
              );

              // Sanitize once before fan-out so only bounded, validated SKU values
              // can influence follow-up provider requests.
              const safePage = sanitizeInventoryRead(inventory, {}, parsed.input);
              const uniqueSkus = [...new Set(safePage.items.map((item) => item.sku))];
              const offerEntries = await Promise.all(
                uniqueSkus.map(async (sku) => [
                  sku,
                  await ebayFetch(
                    `/sell/inventory/v1/offer?sku=${encodeURIComponent(sku)}`,
                    accessToken,
                  ),
                ] as const),
              );
              const offersBySku = Object.fromEntries(offerEntries);
              const sanitized = sanitizeInventoryRead(inventory, offersBySku, parsed.input);
              const recorded = await recordApiRun(
                admin,
                parsed.input.accountId,
                "inventory_read",
                "success",
                Date.now() - startedAt,
                null,
              );
              if (!recorded) {
                return reply({ status: "error", error_code: "api_run_persist_failed" }, 500);
              }
              return reply({ status: "success", ...sanitized });
            } catch {
              const recorded = await recordApiRun(
                admin,
                parsed.input.accountId,
                "inventory_read",
                "error",
                Date.now() - startedAt,
                "inventory_read_fetch_failed",
              );
              if (!recorded) {
                return reply({ status: "error", error_code: "api_run_persist_failed" }, 500);
              }
              return reply(
                {
                  status: "error",
                  error_code: "INVENTORY_READ_FETCH_FAILED",
                  message: "eBay did not return a complete inventory page.",
                },
                502,
              );
            }
          }

          '''.replace("          ", "")
          ebay = ebay.replace(listing_marker, inventory_branch + listing_marker, 1)
          ebay_path.write_text(ebay)

          ci_path = Path(".github/workflows/ci.yml")
          ci = ci_path.read_text()
          ci_marker = "          supabase/functions/ebay-connect-status/index.ts\n"
          assert ci.count(ci_marker) == 1
          assert "supabase/functions/_shared/ebay-inventory-read-core.ts" not in ci
          ci = ci.replace(
            ci_marker,
            ci_marker
            + "          supabase/functions/_shared/ebay-listing-fees-core.ts\n"
            + "          supabase/functions/_shared/ebay-inventory-read-core.ts\n",
            1,
          )
          ci_path.write_text(ci)

          coverage_path = Path("supabase/functions/CI-COVERAGE.md")
          coverage = coverage_path.read_text()
          coverage = coverage.replace(
            "- `ebay-connect-status`\n\n## Generated bundles",
            "- `ebay-connect-status`\n\n## Pure shared cores deno-checked in CI\n\n"
            "- `_shared/ebay-listing-fees-core.ts`\n"
            "- `_shared/ebay-inventory-read-core.ts`\n\n## Generated bundles",
            1,
          )
          coverage = coverage.replace(
            "`ebay-account-sync`, `ebay-end-item`",
            "`ebay-account-sync`, `ebay-end-item`, `ebay-inventory-read`",
            1,
          )
          coverage = coverage.replace(
            "The pure core `_shared/ebay-listing-fees-core.ts` is deno-checked separately below and unit-tested.",
            "The pure cores `_shared/ebay-listing-fees-core.ts` and `_shared/ebay-inventory-read-core.ts` are deno-checked separately above and unit-tested.",
            1,
          )
          coverage_path.write_text(coverage)

          plan_path = Path("supabase/functions/PHASE_B_SELLER_OP_PLAN.md")
          plan = plan_path.read_text()
          plan = plan.replace(
            "Status: **scope + implementation spec** (code to follow on this branch).",
            "Status: **listing_fees + inventory_read implemented; disconnect migration pending review**.",
            1,
          )
          plan = plan.replace(
            "offer{offerId,status,price,marketplaceId,listingId}",
            "offer{offerId,status,marketplaceId,format,price,listingId}",
            1,
          )
          plan_path.write_text(plan)
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit, component, and coverage-meta tests
        run: bunx vitest run

      - name: Deno-check pure seller-operation cores
        run: |
          deno check --no-config --node-modules-dir=manual --no-remote \
            supabase/functions/_shared/ebay-listing-fees-core.ts \
            supabase/functions/_shared/ebay-inventory-read-core.ts

      - name: Secret scan and diff integrity
        run: |
          git diff --check
          SECRET_RE='sk-ant-[A-Za-z0-9_-]{8}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xoxb-[0-9A-Za-z-]{10}|AKIA[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}'
          if grep -rnE "$SECRET_RE" src supabase scripts \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='*.sql' --include='*.mjs' --include='*.sh' \
               2>/dev/null | grep -v node_modules; then
            echo "possible secret committed"
            exit 1
          fi

      - name: Commit verified branch changes
        run: |
          git config user.name "gcv-phase-b-bot"
          git config user.email "gcv-phase-b-bot@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            src/test/ebay/inventory-read-core.test.ts \
            supabase/functions/CI-COVERAGE.md \
            supabase/functions/PHASE_B_SELLER_OP_PLAN.md \
            supabase/functions/_shared/ebay-inventory-read-core.ts \
            supabase/functions/_shared/ebay.ts \
            supabase/functions/ebay-inventory-read/index.ts
          git commit -m "feat(ebay): add admin-only inventory_read operation"
          git push origin HEAD:feat/ebay-seller-operation-boundaries
