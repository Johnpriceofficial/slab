name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every quality gate that verify-live.sh runs locally, now enforced on every
# push/PR so nothing reaches main unchecked. Database integration tests use a
# disposable Supabase stack on the GitHub-hosted runner; no hosted project,
# production credentials, or deployment permissions are involved.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit + component tests
        run: bunx vitest run

      - name: Production build
        run: bun run build

      - name: Deno-check edge functions
        run: >-
          deno check --no-config --node-modules-dir=manual --no-remote
          supabase/functions/analyze-slab/index.ts
          supabase/functions/market-intelligence/index.ts
          supabase/functions/marketplace-scheduler/index.ts
          supabase/functions/pricecharting-marketplace/index.ts
          supabase/functions/pricecharting-search/index.ts
          supabase/functions/pricecharting-sync/index.ts
          supabase/functions/ebay-connect-status/index.ts

      - name: Rebuild edge bundles (must match committed output)
        run: |
          node scripts/build-pricecharting-edge-bundle.mjs
          node scripts/build-pricecharting-marketplace-edge-bundle.mjs
          node scripts/build-analyze-slab-edge-bundle.mjs
          node scripts/build-market-intelligence-edge-bundle.mjs
          if ! git diff --quiet -- supabase/functions/_shared/*-bundle.js; then
            echo "::error::Edge bundle is stale — run the build:*-bundle scripts and commit the output."
            git --no-pager diff --stat -- supabase/functions/_shared/*-bundle.js
            exit 1
          fi

      - name: Secret scan (source + generated bundles)
        run: |
          SECRET_RE='sk-ant-[A-Za-z0-9_-]{8}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xoxb-[0-9A-Za-z-]{10}|AKIA[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}'
          if grep -rnE "$SECRET_RE" src supabase scripts \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='*.sql' --include='*.mjs' --include='*.sh' \
               2>/dev/null | grep -v node_modules; then
            echo "::error::possible secret committed"
            exit 1
          fi
          echo "secret scan clean"

  supabase-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Start disposable Supabase stack
        run: |
          set -o pipefail
          for attempt in 1 2; do
            echo "Starting disposable Supabase stack (attempt $attempt of 2)"
            if timeout 240s supabase start; then
              exit 0
            fi
            echo "::warning::Disposable Supabase startup attempt $attempt failed or timed out"
            docker ps -a || true
            docker system df || true
            supabase stop --no-backup || true
            if [ "$attempt" = "1" ]; then sleep 10; fi
          done
          echo "::error::Disposable Supabase stack failed to start after two bounded clean attempts"
          exit 1

      - name: Reset database from migrations
        run: |
          supabase db reset --local --no-seed
          # Proof-of-freshness marker: consumed by the fail-closed guard below.
          echo "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > /tmp/disposable-db-reset.marker

      - name: Run database integration tests
        env:
          # Never inherited from repository or environment secrets: the direct
          # database address must come from the disposable stack started above.
          SLABVAULT_TEST_DB_URL: ""
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          TEST_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          TEST_SERVICE_KEY="${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          test -n "$API_URL"
          test -n "$TEST_ANON_KEY"
          test -n "$TEST_SERVICE_KEY"

          # ── FAIL-CLOSED DISPOSABLE-TARGET ASSERTIONS ────────────────────────
          # Every one of these must hold BEFORE the direct database address is
          # exported. Any doubt aborts the job instead of touching a database
          # that might not be disposable.
          fail() { echo "::error::$1"; exit 1; }

          # 1. the disposable stack really started in THIS job
          [ -f /tmp/disposable-db-reset.marker ] || fail "no reset marker: the disposable stack was not reset in this job"
          [ "$(cat /tmp/disposable-db-reset.marker)" = "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" ] \
            || fail "reset marker belongs to a different job run"
          docker ps --format '{{.Names}}' | grep -q '^supabase_db_' \
            || fail "no local disposable Supabase database container is running"

          # 2. the direct database address exists and is the local disposable one
          [ -n "${DB_URL:-}" ] || fail "supabase status reported no DB_URL"
          DB_HOST=$(printf '%s' "$DB_URL" | sed -E 's#^[a-z]+://[^@]*@([^:/]+).*#\1#')
          case "$DB_HOST" in
            127.0.0.1|localhost|::1|host.docker.internal|supabase_db_*) ;;
            *) fail "refusing non-disposable database host: $DB_HOST" ;;
          esac

          # 3. the API URL is local too
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) fail "refusing non-local API URL: $API_URL" ;;
          esac

          # 4. neither address may reference the production project
          case "$DB_URL$API_URL" in
            *rcbwemkfcefarqnlgrmv*) fail "production project reference present — aborting" ;;
          esac
          case "$DB_URL$API_URL" in
            *supabase.co*|*supabase.in*|*pooler.supabase.com*) fail "hosted Supabase address present — aborting" ;;
          esac

          # 5. no production-like environment label anywhere in the addresses
          printf '%s' "$DB_URL$API_URL" | grep -Eiq '(^|[^a-z])(prod|production|live)([^a-z]|$)' \
            && fail "production-like label present in the target addresses" || true

          # 6. no stored production database URL may be in play
          [ -z "${PRODUCTION_DB_URL:-}" ] || fail "a stored production database URL is present in the environment"

          echo "disposable target verified: host=$DB_HOST api=$API_URL"

          SLABVAULT_TEST_URL="$API_URL" \
          SLABVAULT_TEST_ANON_KEY="$TEST_ANON_KEY" \
          SLABVAULT_TEST_SERVICE_KEY="$TEST_SERVICE_KEY" \
          SLABVAULT_TEST_DB_URL="$DB_URL" \
            bunx vitest run --config vitest.integration.config.ts \
              --reporter=verbose --reporter=json --outputFile=/tmp/integration.json

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: /tmp/integration.json
          if-no-files-found: warn
          retention-days: 7

      - name: Assert no integration test was skipped
        run: |
          SKIPPED=$(bun -e "const r = await Bun.file('/tmp/integration.json').json(); console.log(r.numPendingTests + r.numTodoTests)")
          TOTAL=$(bun -e "const r = await Bun.file('/tmp/integration.json').json(); console.log(r.numTotalTests)")
          echo "integration tests: total=$TOTAL skipped=$SKIPPED"
          if [ "$SKIPPED" != "0" ]; then
            echo "::error::$SKIPPED integration test(s) were SKIPPED — the live Supabase env did not reach vitest, so nothing was proved."
            exit 1
          fi
          if [ "$TOTAL" = "0" ]; then
            echo "::error::No integration tests ran at all."
            exit 1
          fi
          FAILED=$(bun -e "const r = await Bun.file('/tmp/integration.json').json(); console.log(r.numFailedTests)")
          if [ "$FAILED" != "0" ]; then
            echo "::error::$FAILED integration test(s) FAILED."
            exit 1
          fi
          if [ "$TOTAL" -lt 95 ]; then
            echo "::error::expected at least 95 live database cases, discovered $TOTAL."
            exit 1
          fi

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup

  phase-b-inventory-apply:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/ebay-seller-operation-boundaries'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Determine whether implementation is pending
        id: pending
        run: |
          if [ -f supabase/functions/_shared/ebay-inventory-read-core.ts ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.pending.outputs.run == 'true'
        with:
          bun-version: latest

      - uses: denoland/setup-deno@v2
        if: steps.pending.outputs.run == 'true'
        with:
          deno-version: v2.9.4

      - name: Apply deterministic implementation
        if: steps.pending.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/phase-b-inventory-read.yml').read_text()
          marker = "python3 - <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())
          exec(compile(script, 'phase-b-inventory-read.py', 'exec'))
          PY

      - name: Install dependencies
        if: steps.pending.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Run requested gates
        if: steps.pending.outputs.run == 'true'
        run: |
          bun run typecheck
          bun run lint
          bunx vitest run
          deno check --no-config --node-modules-dir=manual --no-remote \
            supabase/functions/_shared/ebay-listing-fees-core.ts \
            supabase/functions/_shared/ebay-inventory-read-core.ts
          git diff --check
          SECRET_RE='sk-ant-[A-Za-z0-9_-]{8}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xoxb-[0-9A-Za-z-]{10}|AKIA[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}'
          if grep -rnE "$SECRET_RE" src supabase scripts \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='*.sql' --include='*.mjs' --include='*.sh' \
               2>/dev/null | grep -v node_modules; then
            echo "possible secret committed"
            exit 1
          fi

      - name: Commit verified branch changes
        if: steps.pending.outputs.run == 'true'
        run: |
          git config user.name "gcv-phase-b-bot"
          git config user.email "gcv-phase-b-bot@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            src/test/ebay/inventory-read-core.test.ts \
            supabase/functions/CI-COVERAGE.md \
            supabase/functions/PHASE_B_SELLER_OP_PLAN.md \
            supabase/functions/_shared/ebay-inventory-read-core.ts \
            supabase/functions/_shared/ebay.ts \
            supabase/functions/ebay-inventory-read/index.ts
          git commit -m "feat(ebay): add admin-only inventory_read operation"
          git push origin HEAD:feat/ebay-seller-operation-boundaries
